[package]
name = "caboose-display-probe"
description = "Headless Caboose Display client: drives windows and reports what the server sends and its CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
caboose-display-protocol = { path = "../protocol" }
ffmpeg-next = { version = "7.1.0", default-features = false, features = ["codec"] }
libc = "0.2"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
