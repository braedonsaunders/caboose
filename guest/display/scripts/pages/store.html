<!doctype html>
<meta charset="utf-8">
<title>Store page</title>
<style>
/* A game's page in a store client: a sidebar that stays, a sticky header over a scrolled
   pane, a full-width hero, rows of artwork and text. Nothing animates, so every picture
   after a scroll input shows the scroll. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2838; color: #c7d5e0; font: 15px/1.4 sans-serif; }
#side { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #171d25; overflow: hidden; }
#side div { padding: 6px 12px; white-space: nowrap; }
#pane { position: absolute; left: 34%; right: 0; top: 0; bottom: 0; overflow-y: scroll; }
#bar { position: sticky; top: 0; z-index: 2; height: 52px; background: #23262e; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
#bar b { background: #5c7e10; color: white; padding: 8px 22px; border-radius: 3px; }
canvas { display: block; }
.hero { width: 100%; height: 300px; }
section { margin: 18px 20px; padding: 12px; background: #2a3f5a55; border-radius: 4px; }
h3 { margin: 0 0 8px; letter-spacing: 2px; font-size: 13px; color: #8f98a0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid canvas { width: 100%; height: 110px; }
</style>
<div id="side"></div>
<div id="pane"><div id="bar"><b>PLAY</b><span>Halo: The Master Chief Collection</span></div></div>
<script>
// Artwork that compresses like photographs: smooth colour fields with per-pixel grain,
// the same on every run (seeded), so a test can compare pictures.
let seed = 7;
const rand = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
function art(canvas, w, h) {
  const scale = devicePixelRatio;
  canvas.width = w * scale; canvas.height = h * scale;
  const c = canvas.getContext('2d');
  const img = c.createImageData(canvas.width, canvas.height);
  const [r0, g0, b0] = [rand() * 200, rand() * 200, rand() * 200];
  for (let y = 0; y < canvas.height; y++) for (let x = 0; x < canvas.width; x++) {
    const i = (y * canvas.width + x) * 4, n = rand() * 40;
    img.data[i] = r0 + x / canvas.width * 55 + n;
    img.data[i + 1] = g0 + y / canvas.height * 55 + n;
    img.data[i + 2] = b0 + n;
    img.data[i + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}
const side = document.getElementById('side');
for (let i = 0; i < 40; i++) side.insertAdjacentHTML('beforeend', `<div>Game number ${i + 1}: a title</div>`);
const pane = document.getElementById('pane');
const hero = document.createElement('canvas');
hero.className = 'hero';
pane.append(hero);
for (let s = 0; s < 14; s++) {
  const section = document.createElement('section');
  section.innerHTML = `<h3>SECTION ${s + 1}</h3><p>You've played for ${s + 1} hours. Achievements, notes, trading cards and downloadable content for this game, with friends who play it.</p>`;
  if (s % 2 === 0) {
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (let k = 0; k < 4; k++) grid.append(document.createElement('canvas'));
    section.append(grid);
  }
  pane.append(section);
}
addEventListener('load', () => {
  art(hero, pane.clientWidth, 300);
  for (const c of document.querySelectorAll('.grid canvas')) art(c, c.clientWidth, 110);
});
</script>
