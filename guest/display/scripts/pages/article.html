<!doctype html>
<!-- A long article, for browsing and scrolling workloads: headings, paragraphs of
     text, a table and figures (gradients, no network). The same on every load. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caboose article</title>
<style>
  body { margin: 0 auto; max-width: 760px; padding: 16px 20px 400px; background: #fff; color: #202122;
         font: 16px/1.6 sans-serif; }
  h1 { font: 600 30px/1.3 serif; border-bottom: 1px solid #a2a9b1; }
  h2 { font: 600 22px/1.3 serif; border-bottom: 1px solid #c8ccd1; margin-top: 28px; }
  figure { margin: 16px 0; }
  .art { height: 220px; border-radius: 4px; }
  figcaption { font-size: 13px; color: #54595d; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { border: 1px solid #c8ccd1; padding: 4px 8px; }
  th { background: #eaecf0; }
  a { color: #3366cc; }
</style>
<h1>Rail transport in the high country</h1>
<div id="body"></div>
<script>
  const words = ('the line climbs through a series of tunnels and viaducts before reaching the summit ' +
    'where the caboose was attached for the descent and crews changed at the depot while freight ' +
    'waited on the siding beside the water tower and the station master logged every train').split(' ');
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sentence = () => {
    const n = 8 + Math.floor(rand() * 14);
    let s = '';
    for (let i = 0; i < n; i++) s += (i ? ' ' : '') + words[Math.floor(rand() * words.length)];
    return s[0].toUpperCase() + s.slice(1) + '. ';
  };
  const body = document.getElementById('body');
  let html = '';
  for (let section = 1; section <= 14; section++) {
    html += `<h2>Section ${section}: ${words[section % words.length]} and ${words[(section * 3) % words.length]}</h2>`;
    for (let p = 0; p < 4; p++) {
      let text = '';
      for (let i = 0; i < 5; i++) text += sentence();
      html += `<p>${text.replace(/caboose/g, '<a href="#">caboose</a>')}</p>`;
    }
    if (section % 3 === 0) {
      const hue = (section * 47) % 360;
      html += `<figure><div class="art" style="background: linear-gradient(${section * 30}deg, hsl(${hue} 60% 45%),
        hsl(${(hue + 120) % 360} 50% 75%))"></div><figcaption>Figure ${section / 3}. The ${words[section]} at dusk.</figcaption></figure>`;
    }
    if (section % 5 === 0) {
      html += '<table><tr><th>Station</th><th>Elevation</th><th>Opened</th></tr>';
      for (let r = 0; r < 6; r++) html += `<tr><td>${words[(r + section) % words.length]}</td><td>${1000 + r * 137} m</td><td>${1880 + r * 7}</td></tr>`;
      html += '</table>';
    }
  }
  body.innerHTML = html;
</script>
