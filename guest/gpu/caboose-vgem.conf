<?xml version="1.0" standalone="yes"?>
<!-- Mesa loads Zink for the vgem render node (docs/gpu-buffers.md). install-live.py installs
     it in /usr/share/drirc.d and in the Flatpak "host" GL extensions. -->
<driconf>
  <device driver="loader" kernel_driver="vgem">
    <application name="Every application">
      <option name="dri_driver" value="zink" />
    </application>
  </device>
</driconf>
