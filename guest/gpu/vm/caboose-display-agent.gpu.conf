# The agent display as a client of the computer's GPU broker service, on the agent seat's sockets:
# shipped with the GPU stack, so a release makes any image's agent display unit a broker client.
[Unit]
Wants=caboose-gpu-broker.service
After=caboose-gpu-broker.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/libexec/caboose/agent-profile exec /usr/local/bin/caboose-display --listen 0.0.0.0:14601 --socket wayland-caboose-agent --x-display 101 --no-audio --no-games --no-devices --env-file /run/caboose/agent-display.env $$(/usr/local/libexec/caboose-gpu-seat-args agent)'
