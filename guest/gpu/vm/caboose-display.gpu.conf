# The owner display as a client of the computer's GPU broker service (caboose-gpu-broker.service):
# shipped with the GPU stack, so a release makes any image's display unit a broker client.
[Unit]
Wants=caboose-gpu-broker.service
After=caboose-gpu-broker.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/local/bin/caboose-display --env-file /run/caboose/display.env $$(/usr/local/libexec/caboose-gpu-seat-args owner)'
