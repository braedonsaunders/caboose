# 1,600 microsteps / accumulation 8 = 200 optimizer updates.
# Supply --model, --data and --adapter-path explicitly.
train: true
fine_tune_type: lora
num_layers: -1
batch_size: 1
grad_accumulation_steps: 8
iters: 1600
learning_rate: 0.0001
mask_prompt: true
max_seq_length: 512
grad_checkpoint: true
steps_per_report: 40
steps_per_eval: 200
val_batches: 40
save_every: 200
seed: 42
lora_parameters:
  rank: 8
  scale: 2.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.v_proj]
