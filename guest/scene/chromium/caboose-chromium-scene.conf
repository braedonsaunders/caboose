# =============================================================================
# caboose-chromium-scene.conf
#
# Chromium & Electron (claude-desktop, chatgpt, code, obsidian, chromium)
# Layer & Media Bridge Configuration for Caboose OS Decomposition
# ("Zero Server Video" — Owner Seat).
#
# Installed to:
#   /etc/caboose/chromium-scene.conf
#   /etc/chromium-flags.d/90-caboose-scene.conf
#   /etc/electron-flags.conf
# =============================================================================

# --- Environment Variables (sourced by /etc/profile.d/caboose-scene.sh) ------
# Route Electron/Chromium directly to Wayland on the owner seat so subsurface
# quads and video planes reach caboose-display uncomposited:
ELECTRON_OZONE_PLATFORM_HINT=wayland
MOZ_ENABLE_WAYLAND=1
CABOOSE_CHROMIUM_SCENE_BRIDGE=1
CABOOSE_CHROMIUM_TARGETS=claude-desktop,chatgpt,code,obsidian,chromium

# --- Chromium / Electron Command-Line Flags ----------------------------------
--ozone-platform-hint=auto
--ozone-platform=wayland
--enable-wayland-ime

# Delegate <video>, WebGL/WebGPU <canvas>, and rounded-clip layers as separate
# Wayland subsurfaces + wp_viewporter planes instead of flattening into a
# full-window software/GPU bitmap:
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,WaylandOverlayDelegation,UseOzonePlatform,CanvasOopRasterization

# Emit independent scroll tree layers so caboose-display can map DOM scroll
# containers to 0x26 scene.commit ("scroll") nodes and feed 120 Hz iPhone
# flick-scroll gestures back via 0x9A (scene.scroll):
--enable-smooth-scrolling
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist
