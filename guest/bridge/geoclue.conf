# Caboose: the phone's location, when the owner shares it, is written to /etc/geolocation
# by the host and served by GeoClue's static source (docs/native-bridge.md § Location).
[static-source]
enable=true

# The computer has no GeoClue agent to ask the owner; sharing is the owner's choice on the
# phone, so the portal, through which every application asks, is allowed directly.
[xdg-desktop-portal]
allowed=true
system=true
users=
