name: Caboose
options:
  bundleIdPrefix: com.braedonsaunders
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CabooseKit:
    path: CabooseKit
  # The terminal emulator behind the Terminal tab (MIT): truecolor, 256 colours, selection,
  # hardware keyboards and a Metal renderer.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
configFiles:
  Debug: Caboose/Config/Caboose.xcconfig
  Release: Caboose/Config/Caboose.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 9YL3YCJTNT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Caboose:
    type: application
    platform: iOS
    sources:
      - path: Caboose
        excludes: ["Config/*.xcconfig", "Info.plist", "DocumentTypes.generated.plist"]
      - path: Shared
    preBuildScripts:
      - name: Generate document types
        script: python3 "$SRCROOT/scripts/document-types.py" --check --output "$DERIVED_FILE_DIR/Caboose-Info.plist"
        inputFiles:
          - $(SRCROOT)/scripts/document-types.py
          - $(SRCROOT)/../../guest/catalog/catalog.json
          - $(SRCROOT)/Caboose/Info.plist
          - $(SRCROOT)/Caboose/DocumentTypes.generated.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/Caboose-Info.plist
    dependencies:
      - package: CabooseKit
      - package: SwiftTerm
      - target: CabooseShare
      - target: CabooseFiles
      - target: CabooseWidgets
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CABOOSE_APNS_ENVIRONMENT: sandbox
        Release:
          APS_ENVIRONMENT: production
          CABOOSE_APNS_ENVIRONMENT: production
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CABOOSE_APP"
        PRODUCT_BUNDLE_IDENTIFIER: com.braedonsaunders.caboose
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Caboose-Info.plist
        CODE_SIGN_ENTITLEMENTS: Caboose/Caboose.entitlements
  CabooseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Caboose/Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braedonsaunders.caboose.share
        PRODUCT_NAME: CabooseShare
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
  CabooseFiles:
    type: app-extension
    platform: iOS
    dependencies:
      - package: CabooseKit
    sources:
      - path: Files
      - path: Caboose/Host/Credentials.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braedonsaunders.caboose.files
        PRODUCT_NAME: CabooseFiles
        INFOPLIST_FILE: Files/Info.plist
        CODE_SIGN_ENTITLEMENTS: Files/Files.entitlements

  CabooseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist"]
      - path: Shared
      - path: Caboose/Host/Credentials.swift
      - path: Caboose/Host/HostClient.swift
      - path: Caboose/Host/HostClient+Share.swift
      - path: Caboose/Intents/ComputerIntents.swift
      - path: Caboose/Intents/OpenAskIntent.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.braedonsaunders.caboose.widgets
        PRODUCT_NAME: CabooseWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES

  CabooseGeometryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GeometryTests
    dependencies:
      - target: Caboose
      - package: CabooseKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Caboose.app/Caboose
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: com.braedonsaunders.caboose.geometry-tests

schemes:
  Caboose:
    build:
      targets:
        Caboose: all
    run:
      config: Debug
    archive:
      config: Release
  CabooseGeometry:
    build:
      targets:
        Caboose: all
        CabooseGeometryTests: [test]
    test:
      targets:
        - CabooseGeometryTests
