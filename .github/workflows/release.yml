# Native guests, hosts and bundles, each pinned to images of its own architecture.
name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish as (for example v0.2.0-rc.1)
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  computer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: guest
          file: guest/container/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/caboose-computer:${{ env.TAG }}-${{ matrix.arch }}
      - name: Record the image pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "CABOOSE_CONTAINER_IMAGE=$REGISTRY/caboose-computer:$TAG-${{ matrix.arch }}@$DIGEST" > computer.env
      - uses: actions/upload-artifact@v4
        with: { name: 'computer-pin-${{ matrix.arch }}', path: computer.env }

  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for a 16 GiB disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the native image
        run: OUT_DIR="$RUNNER_TEMP/disks" ./guest/image/build.sh
      - name: Compress the disk
        working-directory: ${{ runner.temp }}/disks
        run: zstd -T2 -10 --long=27 --rm base.raw -o base.raw.zst
      - uses: oras-project/setup-oras@v1
      - name: Push the artifact and record its pin
        working-directory: ${{ runner.temp }}/disks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u '${{ github.actor }}' --password-stdin
          ref="$REGISTRY/caboose-base:$TAG-${{ matrix.arch }}"
          oras push "$ref" --artifact-type application/vnd.caboose.microvm.v1 \
            --annotation org.opencontainers.image.architecture=${{ matrix.arch }} \
            base.raw.zst:application/zstd vmlinux:application/octet-stream initrd:application/octet-stream
          digest=$(oras resolve "$ref")
          echo "CABOOSE_BASE_IMAGE=$ref@$digest" > "$GITHUB_WORKSPACE/base.env"
          # Keep the original amd64 reference compatible with existing deployments.
          if [[ '${{ matrix.arch }}' == amd64 ]]; then oras tag "$ref" "$TAG"; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'base-pin-${{ matrix.arch }}', path: base.env }

  host:
    needs: [computer, base]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: 'computer-pin-${{ matrix.arch }}', path: pins }
      - uses: actions/download-artifact@v4
        with: { name: 'base-pin-${{ matrix.arch }}', path: pins }
      - run: cat pins/*.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/host/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            CABOOSE_VERSION=${{ env.TAG }}
            CABOOSE_BASE_IMAGE=${{ env.CABOOSE_BASE_IMAGE }}
            CABOOSE_CONTAINER_IMAGE=${{ env.CABOOSE_CONTAINER_IMAGE }}
          tags: ${{ env.REGISTRY }}/caboose-host:${{ env.TAG }}-${{ matrix.arch }}

  image-indexes:
    needs: [computer, host]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publish architecture-selecting tags
        run: |
          for name in caboose-computer caboose-host; do
            docker buildx imagetools create -t "$REGISTRY/$name:$TAG" \
              "$REGISTRY/$name:$TAG-amd64" "$REGISTRY/$name:$TAG-arm64"
            if [[ $TAG != *-* ]]; then
              docker buildx imagetools create -t "$REGISTRY/$name:latest" "$REGISTRY/$name:$TAG"
            fi
          done

  bundles:
    needs: [computer, base]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    env:
      CABOOSE_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with: { name: 'computer-pin-${{ matrix.arch }}', path: pins }
      - uses: actions/download-artifact@v4
        with: { name: 'base-pin-${{ matrix.arch }}', path: pins }
      - run: cat pins/*.env >> "$GITHUB_ENV"
      - if: matrix.os == 'darwin'
        run: brew install zstd xz
      - run: pnpm install --frozen-lockfile
      - name: Build the native bundle
        run: bash apps/host/scripts/bundle.sh '${{ matrix.os }}' '${{ matrix.arch }}' dist/release
      - name: Check the native bundle
        run: |
          extension=tar.zst
          [[ '${{ matrix.os }}' != darwin ]] || extension=tar.gz
          bash apps/host/scripts/check-bundle.sh "dist/release/caboose-host-${{ matrix.os }}-${{ matrix.arch }}.$extension"
      - name: Check the macOS installer
        if: matrix.os == 'darwin'
        run: bash deploy/macos/check.sh dist/release/caboose-host-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: 'bundle-${{ matrix.os }}-${{ matrix.arch }}', path: dist/release/ }

  publish-bundles:
    needs: [bundles, image-indexes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Hosts, installers and Docker pull the images anonymously. GHCR makes a new package
      # private, so a first release stops here until each package is set to public.
      - name: Check the images are public
        run: |
          owner=${REGISTRY#ghcr.io/}
          for name in caboose-host caboose-computer caboose-base; do
            token=$(curl -sS "https://ghcr.io/token?scope=repository:$owner/$name:pull" | jq -r ".token // empty" || true)
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$owner/$name/manifests/$TAG-amd64" ||
              { echo "::error::$REGISTRY/$name is not publicly pullable. Set it to public in its package settings, then re-run this job."; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with: { pattern: 'bundle-*', path: bundles }
      - name: Combine checksums and attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release
          for bundle in bundles/*; do
            for archive in "$bundle"/*.tar.zst "$bundle"/*.tar.gz "$bundle"/*.sha256; do
              [[ ! -f $archive ]] || cp "$archive" release/
            done
            cat "$bundle/SHA256SUMS" >> release/SHA256SUMS
          done
          (cd release && sha256sum -c SHA256SUMS)
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${prerelease[@]}" ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" release/* --clobber
