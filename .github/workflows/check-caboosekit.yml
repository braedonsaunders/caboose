name: Check CabooseKit

on:
  pull_request:
    paths:
      - 'apps/ios/CabooseKit/**'
      - 'guest/display/vectors/**'
      - '.github/workflows/check-caboosekit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caboosekit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: |
          swift --version
          sw_vers
          xcodebuild -version
          sysctl hw.model hw.machine hw.ncpu
          system_profiler SPHardwareDataType
      - name: Check protocol, session and Metal surface behavior
        run: swift test --package-path apps/ios/CabooseKit --disable-sandbox -j 2 --filter 'CabooseDisplaySessionTests|DisplayVectorTests|h264KeyframeDecodesIntoTheWindow|hevcKeyframeIsCroppedAndScaled|TileTests|WindowSurfaceTests'
      - name: Check the complete kit
        run: swift test --package-path apps/ios/CabooseKit --disable-sandbox -j 2
      - name: Collect crash diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp ~/Library/Logs/DiagnosticReports/*.ips diagnostics/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: caboosekit-crash-reports
          path: diagnostics
          if-no-files-found: ignore
