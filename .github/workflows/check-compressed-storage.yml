name: Check compressed guest storage

on:
  pull_request:
    paths:
      - '.github/workflows/check-compressed-storage.yml'
      - 'guest/image/**'
      - 'apps/host/src/*appliance*'
      - 'apps/host/scripts/check-parked-appliance.sh'
      - 'apps/host/scripts/tests/*appliance*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compressed-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scratch-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable storage check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs erofs-utils xfsprogs libguestfs-tools python3-guestfs attr
      - name: Check compression and loop discard
        run: |
          sudo timeout --kill-after=10s 180s guest/image/check-compressed-storage.sh
          sudo timeout --kill-after=10s 180s guest/image/check-system-image.sh
          sudo timeout --kill-after=10s 180s guest/image/check-system-overlay.sh
      - name: Check legacy and Btrfs appliance reads on scratch XFS
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          loop=
          cleanup() {
            sudo umount "$work/mount" 2>/dev/null || true
            if [ -n "$loop" ]; then sudo losetup -d "$loop"; fi
            sudo rm -rf "$work"
          }
          trap cleanup EXIT
          truncate -s 3G "$work/xfs.raw"
          mkfs.xfs -f -m reflink=1 "$work/xfs.raw"
          mkdir "$work/mount"
          loop=$(sudo losetup --find --show "$work/xfs.raw")
          sudo mount "$loop" "$work/mount"
          sudo bash apps/host/scripts/check-parked-appliance.sh "$work/mount"
      - name: Check measured migration packing through real appliances
        run: sudo /usr/bin/python3 apps/host/scripts/tests/check-compressed-migration.py --work "$RUNNER_TEMP"
