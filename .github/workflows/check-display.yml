name: Check display and guest contracts

on:
  pull_request:
    paths:
      - '.github/workflows/check-display.yml'
      - 'guest/display/**'
      - 'guest/apps/**'
      - 'guest/files/**'
      - 'guest/template/**'
      - 'guest/components/**'
      - 'guest/container/Dockerfile'
      - 'guest/image/Dockerfile'
      - 'guest/image/build-inside.sh'
      - 'apps/host/Dockerfile'
      - 'apps/ios/CabooseKit/Sources/CabooseKit/Resources/AgentApp*.js'
  workflow_dispatch:
    inputs:
      desktop_apm:
        description: Run only the bounded desktop MCP acceptance gate
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: display-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.desktop_apm != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check guest bridge and injected page contracts
        run: |
          python3 -m unittest guest.components.test_staging guest.components.test_install guest.components.test_vsock_services guest.components.test_container_services.BusStartup
          python3 -m unittest discover -s guest/apps -p 'test_*.py'
          python3 guest/files/test_webview_endpoint.py
          python3 guest/files/test_parked_quiesce.py
          python3 guest/template/test_template.py
          python3 -m unittest guest.components.test_owner_run
          node --test guest/apps/agent-page.test.mjs
      - name: Build the Linux display test environment
        run: docker build -t caboose-display-dev guest/display
      - name: Check the combined compositor and protocol
        env:
          CABOOSE_DISPLAY_CPUS: '2'
          CABOOSE_DISPLAY_MEMORY: 4g
        run: guest/display/scripts/dev.sh cargo test --workspace

  desktop-apm:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_apm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded Linux display and AT-SPI acceptance
        shell: bash
        run: |
          set -o pipefail
          bash guest/desktop-mcp/check-bounded.sh 2>&1 | tee "$RUNNER_TEMP/desktop-apm.log"
      - name: Verify cleanup and bound failure evidence
        if: always()
        shell: bash
        run: |
          # Fallback for cancellation: only this immutable checkout's test containers.
          prefix="caboose-apm-${GITHUB_SHA:0:12}-"
          docker ps -aq --filter "name=$prefix" | xargs -r docker rm -f
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            docker ps -a --filter "name=$prefix" --format '{{.Names}} {{.Status}}'
            tail -c 2097152 "$RUNNER_TEMP/desktop-apm.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/desktop-apm-evidence.log"
      - name: Upload bounded failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-apm-failure-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-apm-evidence.log
          retention-days: 7
          if-no-files-found: warn
