name: Check desktop APM acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-apm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded Linux display and AT-SPI acceptance
        shell: bash
        run: |
          set -o pipefail
          bash guest/desktop-mcp/check-bounded.sh 2>&1 | tee "$RUNNER_TEMP/desktop-apm.log"
      - name: Verify cleanup and bound failure evidence
        if: always()
        shell: bash
        run: |
          # Fallback for cancellation: only this immutable checkout's test containers.
          prefix="caboose-apm-${GITHUB_SHA:0:12}-"
          docker ps -aq --filter "name=$prefix" | xargs -r docker rm -f
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            docker ps -a --filter "name=$prefix" --format '{{.Names}} {{.Status}}'
            tail -c 2097152 "$RUNNER_TEMP/desktop-apm.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/desktop-apm-evidence.log"
      - name: Upload bounded failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-apm-failure-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-apm-evidence.log
          retention-days: 7
          if-no-files-found: warn
