name: Check GPU streams

on:
  pull_request:
    paths:
      - '.github/workflows/check-gpu-stream.yml'
      - 'apps/ios/GPUStream/**'
      - 'apps/ios/CabooseKit/**'
      - 'apps/ios/scripts/build-gpu-stream.sh'
      - 'guest/display/**'
      - 'docs/gpu-stream.md'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: gpu-stream-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-pure:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record source and toolchain
        run: |
          bash apps/ios/GPUStream/tests/check_pipeline.sh
          mkdir -p .gpu-check-logs
          git rev-parse HEAD > .gpu-check-logs/source.txt
          xcodebuild -version > .gpu-check-logs/toolchain.txt
          swift --version >> .gpu-check-logs/toolchain.txt
      - name: Check the full Swift suite without the native player
        working-directory: apps/ios/CabooseKit
        run: swift test --jobs 1 2>&1 | tee ../../../.gpu-check-logs/swift-pure.log
      - name: Bound retained logs
        if: always()
        run: python3 apps/ios/GPUStream/tests/bound_logs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stream-swift-pure-${{ github.sha }}
          path: .gpu-check-logs/*
          retention-days: 7
  replay:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain and synthetic fixture
        run: |
          bash apps/ios/GPUStream/tests/check_pipeline.sh
          mkdir -p .gpu-check-logs
          git rev-parse HEAD > .gpu-check-logs/source.txt
          test "$(uname -m)" = arm64
          xcodebuild -version | tee .gpu-check-logs/toolchain.txt
          swift --version | tee -a .gpu-check-logs/toolchain.txt
          echo '90db2232be2940106b852eb8af5959872c1d2d2cc69dedccc57d981bcbaae123  apps/ios/GPUStream/tests/fixtures/vkcube.gfxr' | shasum -a 256 -c -
          shasum -a 256 apps/ios/GPUStream/tests/fixtures/vkcube.gfxr > .gpu-check-logs/fixture.sha256
          python3 apps/ios/GPUStream/tests/check_fixture.py | tee .gpu-check-logs/fixture.log
      - name: Build the exact native player source
        run: |
          command -v ninja >/dev/null || brew install ninja
          sh apps/ios/scripts/build-gpu-stream.sh macos 2>&1 | tee .gpu-check-logs/build.log
          shasum -a 256 apps/ios/build/gpu-stream/lib/macos/libCabooseGPUStream.a \
            apps/ios/CabooseKit/Frameworks/CabooseGPUStream.xcframework/macos-arm64/libCabooseGPUStream.a > .gpu-check-logs/rebuilt-library.sha256
      - name: Check actual MoltenVK proc lookup and instance concurrency
        run: |
          xcrun clang++ -std=c++20 -pthread \
            -Iapps/ios/GPUStream/src \
            -Iapps/ios/build/gpu-stream/gfxreconstruct/external/Vulkan-Headers/include \
            apps/ios/GPUStream/tests/moltenvk.cpp \
            apps/ios/build/gpu-stream/lib/macos/libCabooseGPUStream.a \
            -framework Foundation -framework Metal -framework QuartzCore \
            -framework IOSurface -framework AppKit -framework IOKit \
            -framework CoreGraphics -lz -o apps/ios/build/gpu-stream/check-moltenvk
          MVK_CONFIG_PERFORMANCE_TRACKING=1 MVK_CONFIG_ACTIVITY_PERFORMANCE_LOGGING_STYLE=3 apps/ios/build/gpu-stream/check-moltenvk 2>&1 | tee .gpu-check-logs/moltenvk.log
      - name: Replay, resume, file-prefix and concurrent captures
        working-directory: apps/ios/CabooseKit
        env:
          CABOOSE_GPU_CAPTURE: ${{ github.workspace }}/apps/ios/GPUStream/tests/fixtures/vkcube.gfxr
          CABOOSE_GPU_CAPTURE_FRAMES: '300'
        run: |
          swift test --jobs 1 --list-tests 2>&1 | tee ../../../.gpu-check-logs/native-tests.log | grep 'twoCapturesReplayConcurrentlyWithIndependentState'
          swift test --jobs 1 --filter GPUStream 2>&1 | tee ../../../.gpu-check-logs/replay.log
      - name: Bound retained logs
        if: always()
        run: python3 apps/ios/GPUStream/tests/bound_logs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stream-replay-${{ github.sha }}
          path: .gpu-check-logs/*
          retention-days: 7
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record source
        run: |
          bash apps/ios/GPUStream/tests/check_pipeline.sh
          mkdir -p .gpu-check-logs
          git rev-parse HEAD > .gpu-check-logs/source.txt
      - name: Build the display test environment
        run: docker build -t caboose-display-dev guest/display 2>&1 | tee .gpu-check-logs/build.log
      - name: Check protocol and relay
        env:
          CABOOSE_DISPLAY_CPUS: '2'
          CABOOSE_DISPLAY_MEMORY: 4g
        run: guest/display/scripts/dev.sh cargo test --workspace 2>&1 | tee .gpu-check-logs/relay.log
      - name: Bound retained logs
        if: always()
        run: python3 apps/ios/GPUStream/tests/bound_logs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stream-relay-${{ github.sha }}
          path: .gpu-check-logs/*
          retention-days: 7
