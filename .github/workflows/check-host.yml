name: Check host and console

on:
  pull_request:
    paths:
      - '.github/workflows/check-host.yml'
      - 'apps/host/**'
      - 'apps/web/**'
      - 'packages/capacity/**'
      - 'guest/components/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-and-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter caboose-host typecheck
      - run: pnpm --filter caboose-host exec vitest run --maxWorkers=2 --no-file-parallelism
      - name: Check offline storage and appliance boundaries
        run: |
          python3 apps/host/scripts/tests/test-migration-transaction.py
          python3 apps/host/scripts/tests/test-migration-appliance.py
          python3 apps/host/scripts/tests/test-migration-appliance-guard.py
          python3 apps/host/scripts/tests/test-migrate-disk.py
          python3 apps/host/scripts/tests/test-parked-appliance.py
          python3 apps/host/scripts/tests/check-host-lock.py
          python3 apps/host/scripts/tests/test-offline-recovery.py

  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter caboose-web typecheck
      - run: pnpm --filter caboose-web test
      - run: pnpm --filter caboose-web build
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: apps/web/dist
          retention-days: 3

  disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/host/disk
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
      - name: Share, punch and describe blocks on a real XFS filesystem
        run: sudo scripts/check-reflink.sh target/release/caboose-disk xfs
