<!-- Caboose wordmark (dark). Generated by apps/web/src/brand/brand.ts; do not edit by hand —
     change brand.ts and run `pnpm --filter caboose-web test -u`. The rail draws, "caboose" writes
     itself in, the amber hubs pop, and the train rolls one wheel-turn (six ties slide by), then again
     every 12 s. Resting styles are the finished logo, so still renderers show it complete. -->
<svg xmlns="http://www.w3.org/2000/svg" id="caboose" viewBox="-22 -50 836 185" width="542.27" height="120" role="img" aria-labelledby="caboose-title"><title id="caboose-title">Caboose</title><style>
    @keyframes cb-draw { from { stroke-dashoffset: 1; } }
    @keyframes cb-fade { from { opacity: 0; } }
    @keyframes cb-pop { from { opacity: 0; transform: scale(.2); } }
    @keyframes cb-roll-in { from { transform: translateX(251.33px); } }
    @keyframes cb-turn-in { from { transform: rotate(-360deg); } }
    @keyframes cb-roll-cycle {
      0% { transform: translateX(251.33px); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      18.33%, 100% { transform: translateX(0); }
    }
    @keyframes cb-turn-cycle {
      0% { transform: rotate(-360deg); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      18.33%, 100% { transform: rotate(0); }
    }
    @keyframes cb-roll { from { transform: translateX(251.33px); } to { transform: translateX(0); } }
    @keyframes cb-turn { from { transform: rotate(-360deg); } to { transform: rotate(0); } }
    #caboose .wheel, #caboose .pop { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { #caboose * { animation: none !important; } }
    #caboose .st { stroke-dasharray: 1; animation: cb-draw 0.55s cubic-bezier(.4,0,.2,1) var(--d) backwards; }
    #caboose .rail { stroke-dasharray: 1; animation: cb-draw 0.7s cubic-bezier(.4,0,.2,1) 0.05s backwards; }
    #caboose .spoke { animation: cb-fade .3s ease-out var(--d) backwards; }
    #caboose .pop { animation: cb-pop 0.45s cubic-bezier(.34,1.56,.64,1) var(--d) backwards; }
    #caboose .wheel { animation: cb-turn-in 2.2s cubic-bezier(.3,.1,.2,1) 0.7s backwards, cb-turn-cycle 12s linear 12.7s infinite; }
