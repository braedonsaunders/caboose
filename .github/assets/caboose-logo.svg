    #caboose .wheel { animation: cb-turn-in 3.2s cubic-bezier(.16,1,.3,1) 0.65s backwards, cb-turn-cycle 24s linear 24.65s infinite; }
    #caboose .ties { animation: cb-roll-in 3.2s cubic-bezier(.16,1,.3,1) 0.65s backwards, cb-roll-cycle 24s linear 24.65s infinite; }
    #caboose .track { animation: cb-ties-cycle 24s linear 0.65s infinite; }
