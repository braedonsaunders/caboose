<!-- Caboose wordmark (light). Generated by apps/web/src/brand/brand.ts; do not edit by hand —
     change brand.ts and run `pnpm -F caboose-web test -u`. The rail draws, "caboose" writes
     itself in, the amber hubs pop, and the train rolls three wheel-turns over ties that show only for
     the ride, then again every 24 s. Resting styles are the finished logo, so still renderers
     show it complete. -->
<svg xmlns="http://www.w3.org/2000/svg" id="caboose" viewBox="-4 -42 784 172" width="546.98" height="120" role="img" aria-labelledby="caboose-title"><title id="caboose-title">Caboose</title><style>
    @keyframes cb-roll { from { transform: translateX(251.33px); } to { transform: translateX(0); } }
    @keyframes cb-turn { from { transform: rotate(-360deg); } to { transform: rotate(0); } }
    #caboose .wheel, #caboose .pop { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { #caboose * { animation: none !important; } }
    @keyframes cb-roll-cycle {
      0% { transform: translateX(753.99px); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      13.33%, 100% { transform: translateX(0); }
    }
    @keyframes cb-turn-cycle {
      0% { transform: rotate(-1080deg); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      13.33%, 100% { transform: rotate(0); }
    }
    @keyframes cb-ties-cycle {
      0%, 16.67%, 100% { opacity: 0; }
      1.67%, 13.33% { opacity: 1; }
    }
    #caboose .track { opacity: 0; }
    @keyframes cb-draw { from { stroke-dashoffset: 1; } }
    @keyframes cb-fade { from { opacity: 0; } }
    @keyframes cb-pop { from { opacity: 0; transform: scale(.2); } }
    @keyframes cb-roll-in { from { transform: translateX(753.99px); } }
    @keyframes cb-turn-in { from { transform: rotate(-1080deg); } }
    #caboose .st { stroke-dasharray: 1; animation: cb-draw 0.55s cubic-bezier(.4,0,.2,1) var(--d) backwards; }
    #caboose .rail { stroke-dasharray: 1; animation: cb-draw 0.7s cubic-bezier(.4,0,.2,1) 0.05s backwards; }
    #caboose .spoke { animation: cb-fade .3s ease-out var(--d) backwards; }
    #caboose .pop { animation: cb-pop 0.45s cubic-bezier(.34,1.56,.64,1) var(--d) backwards; }
    #caboose .wheel { animation: cb-turn-in 3.2s cubic-bezier(.3,.1,.2,1) 0.7s backwards, cb-turn-cycle 24s linear 24.7s infinite; }
    #caboose .ties { animation: cb-roll-in 3.2s cubic-bezier(.3,.1,.2,1) 0.7s backwards, cb-roll-cycle 24s linear 24.7s infinite; }
