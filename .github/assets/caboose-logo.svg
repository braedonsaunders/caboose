<!-- Caboose wordmark (light). Generated by apps/web/src/brand/brand.ts; do not edit by hand —
     change brand.ts and run `pnpm -F caboose-web test -u`. The dual-flange rail draws, "caboose"
     writes itself in, the amber hubs pop, and the train rolls three wheel-turns over machined
     sleepers with an amber rail pulse, then again every 24 s. Resting styles are the
     finished logo, so still renderers show it complete. -->
<svg xmlns="http://www.w3.org/2000/svg" id="caboose" viewBox="-12 -46 800 186" width="516.13" height="120" role="img" aria-labelledby="caboose-title"><title id="caboose-title">Caboose</title><style>
    @keyframes cb-roll { from { transform: translateX(254.47px); } to { transform: translateX(0); } }
    @keyframes cb-turn { from { transform: rotate(-360deg); } to { transform: rotate(0); } }
    @keyframes cb-beam { from { transform: translateX(-240px); } to { transform: translateX(800px); } }
    #caboose .wheel, #caboose .pop { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { #caboose * { animation: none !important; } }
    @keyframes cb-roll-cycle {
      0% { transform: translateX(763.41px); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      13.33%, 100% { transform: translateX(0); }
    }
    @keyframes cb-turn-cycle {
      0% { transform: rotate(-1080deg); animation-timing-function: cubic-bezier(.45,0,.2,1); }
      13.33%, 100% { transform: rotate(0); }
    }
    @keyframes cb-ties-cycle {
      0%, 16.67%, 100% { opacity: 0; }
      1.67%, 13.33% { opacity: 1; }
    }
    @keyframes cb-beam-cycle {
      0% { transform: translateX(-240px); opacity: 0; animation-timing-function: cubic-bezier(.4,0,.2,1); }
      1.67%, 11.67% { opacity: 1; }
      13.33%, 100% { transform: translateX(800px); opacity: 0; }
    }
    #caboose .track { opacity: 0; }
    #caboose .beam { opacity: 0; }
    @keyframes cb-draw { from { stroke-dashoffset: 1; } }
    @keyframes cb-fade { from { opacity: 0; } }
    @keyframes cb-pop { from { opacity: 0; transform: scale(.2); } }
    @keyframes cb-roll-in { from { transform: translateX(763.41px); } }
    @keyframes cb-turn-in { from { transform: rotate(-1080deg); } }
    #caboose .st { stroke-dasharray: 1; animation: cb-draw 0.65s cubic-bezier(.22,1,.36,1) var(--d) backwards; }
    #caboose .rail { stroke-dasharray: 1; animation: cb-draw 0.8s cubic-bezier(.22,1,.36,1) 0.05s backwards; }
    #caboose .flange, #caboose .spoke { animation: cb-fade .35s ease-out var(--d) backwards; }
