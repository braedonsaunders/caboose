# The Caboose WSL distribution. Upgrades replace this file; put host settings in
# /etc/caboose/host.env instead.
[boot]
systemd=true

[user]
default=root

[network]
generateResolvConf=true

# Nothing in this distribution runs Windows programs, so it is given no way to.
[interop]
enabled=false
appendWindowsPath=false
